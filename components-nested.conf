# Agora components, for the NESTED TESTING BUILD — `components.conf` with one line changed.
#
# **WHY THIS FILE EXISTS.** `components.conf` is the release, and its window server is DRM-only by decision: the
# X11 backend is a development convenience and the shipped compositor does not carry it. But `agora-session`, the
# launcher this release installs, starts the window server NESTED on an X11 desktop — so a person who wants the
# session a tester runs on top of their existing desktop needs the same components with that one backend turned on.
#
#   make COMPONENTS=components-nested.conf install
#
# **THE DIFFERENCE IS EXACTLY ONE LINE: `window-server` gains `-DAWS_WITH_X11=ON`.** DRM and libinput stay on, so a
# nested testing install is also a compositor that can drive a real console. Everything else — the order, the extra
# arguments, the components themselves — is `components.conf`, and the build driver's check that this list names every
# submodule exactly once applies here too. The long comments about why each line sits where it does are in
# `components.conf` and are not repeated: one file owns the reasoning, this one owns the variant.

libagora-objc        -DLIBOBJC_INSTALL_BLOCK_COMPATIBILITY_HEADERS=OFF
libagora-dispatch
libagora-lcms2        -DLCMS2_BUILD_TOOLS=OFF
libagora-tsm
libagora-core
libagora-drawing
libagora-text
libagora-base
libagora-audio
libagora-data
libagora-launchservices
libagora-watch
libagora-iconservices
libagora-app
libagora-webview
workspace
dock
systemui
window-server        -DAWS_WITH_DRM=ON -DAWS_WITH_LIBINPUT=ON -DAWS_WITH_X11=ON
terminal
forge
widget-zoo            --skip
