# Agora components, in build order.
#
# One line per component: <directory> [extra cmake arguments...]
# The token `--skip` marks a component that is not built yet.
#
# The order is the dependency order: a component appears only after every
# component it resolves with find_package(). It is data, not code, so a release
# that pins different revisions can carry a different order. The driver checks
# that this list names every submodule exactly once.
#
# The driver passes the shared options (prefix, compilers, BUILD_TESTING=OFF)
# to every component; only a component's own extra arguments belong here.

# **THE TOP-LEVEL BLOCKS HEADERS HAVE ONE OWNER IN A COMBINED PREFIX, AND IT IS DISPATCH.** libagora-dispatch's
# standalone libBlocksRuntime installs include/Block.h and include/Block_private.h; libagora-objc's embedded runtime
# installs compatibility copies of the same two paths unless it is told not to. Here it is told not to, so the install
# has one owner instead of an installation-order-dependent overwrite. See both components' READMEs.
libagora-objc        -DLIBOBJC_INSTALL_BLOCK_COMPATIBILITY_HEADERS=OFF
libagora-dispatch
libagora-lcms2        -DLCMS2_BUILD_TOOLS=OFF
# **`libagora-tsm` DEPENDS ON NOTHING IN THIS TREE**, so it comes before the stack: it is a terminal-emulator state
# machine over plain C and the system's xkbcommon (libtsm, MIT). Its consumer is `terminal`, which is last because it
# resolves the AppKit and the state machine with find_package() and nothing else in the tree consumes it.
libagora-tsm
libagora-core
libagora-drawing
libagora-text
libagora-base
# AppKit requires Core Data (`find_package(AgoraData CONFIG)`), so Core Data comes after Foundation and before it.
libagora-data
libagora-launchservices
libagora-watch
libagora-iconservices
libagora-app
workspace
window-server        -DAWS_WITH_DRM=ON -DAWS_WITH_LIBINPUT=ON -DAWS_WITH_X11=OFF
terminal
widget-zoo            --skip
